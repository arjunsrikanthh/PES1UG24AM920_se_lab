name: SE Lab 5 CI
on:
  push:
    paths: ["Lab-5/**", ".github/workflows/se-lab5.yml"]
  pull_request:
    paths: ["Lab-5/**", ".github/workflows/se-lab5.yml"]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab-5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests and coverage gate
        run: python -m pytest tests -v --cov=engine --cov-fail-under=80 --cov-report=xml --cov-report=term-missing
      - name: Ruff static analysis
        run: python -m ruff check engine tests
      - name: Black formatting
        run: python -m black --check engine tests
      - name: Bandit security check
        run: python -m bandit -r engine -q
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab5-coverage
          path: Lab-5/coverage.xml
          if-no-files-found: ignore
