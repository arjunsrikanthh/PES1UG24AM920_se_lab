name: SE Lab 5 static analysis
on:
  push:
    paths: ['Lab-5/**', '.github/workflows/se-lab5-static-analysis.yml']
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analyzers
        run: python -m pip install pylint bandit flake8
      - name: Save original and corrected reports
        run: |
          mkdir -p scan-results/original scan-results/corrected
          cp Lab-5/support_ticket_tracker_original.py.txt scan-results/original/support_ticket_tracker.py
          cp Lab-5/support_ticket_tracker.py scan-results/corrected/support_ticket_tracker.py
          for label in original corrected; do
            (cd "scan-results/$label" && pylint support_ticket_tracker.py > pylint_report.txt 2>&1) || true
            (cd "scan-results/$label" && bandit -r support_ticket_tracker.py > bandit_report.txt 2>&1) || true
            (cd "scan-results/$label" && flake8 support_ticket_tracker.py > flake8_report.txt 2>&1) || true
          done
      - name: Run regression tests and quality gates
        run: |
          cd Lab-5
          python -m unittest discover -s tests -v
          pylint --fail-under=9.51 support_ticket_tracker.py
          bandit -r support_ticket_tracker.py
          flake8 support_ticket_tracker.py
      - name: Archive six before-after scanner reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab5-static-analysis-before-after
          path: scan-results/
